[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evo2-pathogenicity-mvp"
version = "0.2.0"
description = "Research-only Evo 2 frozen encoder and DNA student pathogenicity pipeline"
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires a real NVIDIA Evo 2 API key and explicit opt-in"]

